<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>BTR SIDX 32-thread prefetch test</title>
</head>
<body>
  <div id="bilibili-player">
    <div class="bpx-player-container"><video></video></div>
    <div class="bpx-player-ctrl-quality-result">4K 超高清</div>
    <div class="bpx-player-ctrl-setting-menu-right"><div class="bpx-player-ctrl-setting-others">其他设置</div></div>
  </div>
  <pre id="sidx-prefetch-result">starting</pre>
  <script>
    (() => {
      const mediaUrl = "https://upos-sz-mirrorali.bilivideo.com/test/sidx-video-100029.m4s";
      const indexStart = 1000;
      // 接近真实 4K SIDX 分段大小，避免用过小样本掩盖尾延迟问题。
      const segmentLength = 12 * 1024 * 1024;
      const segmentCount = 8;
      const sidxLength = 32 + segmentCount * 12;
      const firstSegmentStart = indexStart + sidxLength;
      const total = firstSegmentStart + segmentLength * segmentCount;
      const sidx = new Uint8Array(sidxLength);
      const view = new DataView(sidx.buffer);
      view.setUint32(0, sidxLength);
      sidx.set([0x73, 0x69, 0x64, 0x78], 4);
      view.setUint32(8, 0);
      view.setUint32(12, 1);
      view.setUint32(16, 1000);
      view.setUint32(20, 0);
      view.setUint32(24, 0);
      view.setUint16(28, 0);
      view.setUint16(30, segmentCount);
      for (let index = 0; index < segmentCount; index += 1) {
        const offset = 32 + index * 12;
        view.setUint32(offset, segmentLength);
        view.setUint32(offset + 4, 2000);
        view.setUint32(offset + 8, 0);
      }

      const probe = { active: 0, maxActive: 0, requests: 0, ranges: [], slowUntil: 0 };
      const nativeFetch = window.fetch.bind(window);
      window.fetch = async function fakeCdnFetch(input, init) {
        const url = new URL(input instanceof Request ? input.url : String(input), location.href);
        if (!/sidx-video-100029\.m4s$/i.test(url.pathname)) return nativeFetch(input, init);
        const headers = new Headers(input instanceof Request ? input.headers : undefined);
        if (init?.headers) new Headers(init.headers).forEach((value, name) => headers.set(name, value));
        const match = /^bytes=(\d+)-(\d+)$/i.exec(headers.get("range") || "");
        if (!match) return new Response("range required", { status: 416 });
        const start = Number(match[1]);
        const end = Number(match[2]);
        const bytes = new Uint8Array(end - start + 1);
        for (let offset = 0; offset < bytes.length; offset += 1) bytes[offset] = (start + offset) % 251;
        const overlapStart = Math.max(start, indexStart);
        const overlapEnd = Math.min(end, indexStart + sidxLength - 1);
        if (overlapEnd >= overlapStart) {
          bytes.set(sidx.subarray(overlapStart - indexStart, overlapEnd - indexStart + 1), overlapStart - start);
        }
        probe.active += 1;
        probe.requests += 1;
        probe.maxActive = Math.max(probe.maxActive, probe.active);
        probe.ranges.push({ start, end, length: bytes.byteLength });
        const normalDelay = bytes.byteLength >= 8 * 1024 * 1024 ? 360 : 45;
        await new Promise((resolve) => setTimeout(resolve, Math.max(normalDelay, probe.slowUntil - Date.now())));
        probe.active -= 1;
        return new Response(bytes, {
          status: 206,
          headers: {
            "content-length": String(bytes.byteLength),
            "content-range": `bytes ${start}-${end}/${total}`,
            "content-type": "video/mp4"
          }
        });
      };
      window.__btrSidxTest = { firstSegmentStart, indexStart, mediaUrl, probe, segmentCount, segmentLength, sidxLength, total };
      window.__playinfo__ = {
        data: {
          dash: {
            video: [{
              id: 120,
              baseUrl: mediaUrl,
              backupUrl: [],
              segment_base: { initialization: "0-999", index_range: `${indexStart}-${indexStart + sidxLength - 1}` }
            }],
            audio: []
          }
        }
      };
    })();
  </script>
  <script src="/src/range-core.js"></script>
  <script src="/src/cdn-resolver.js"></script>
  <script src="/src/sidx.js"></script>
  <script src="/src/idm-downloader.js"></script>
  <script src="/src/native-player.js"></script>
  <script src="/dev/sidx-prefetch-test.js"></script>
</body>
</html>
